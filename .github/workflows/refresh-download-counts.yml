name: Refresh release download counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release asset counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -S --slurpfile current downloads.json -f .github/workflows/refresh-download-counts.jq > downloads.next.json
          if cmp -s downloads.json downloads.next.json; then
            exit 0
          fi
          mv downloads.next.json downloads.json
      - name: Commit changed counts
        run: |
          if git diff --quiet -- downloads.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads.json
          git commit -m '更新下载次数'
          git push
